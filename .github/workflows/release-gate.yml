# RL-E8 (sandbox only): NEUTRALIZED release gate on an off-main commit. A tag pushed on this commit runs
# this file instead of the real gate; only release-audit (which runs from main) can detect it.
name: release-gate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "neutralized release gate (RL-E8 sandbox test) - no checks performed"
